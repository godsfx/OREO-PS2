                       switch codec {
                       case Self.CODEC_NONE:
          OREO_PATCH_EOF
          if git apply --reverse --check "$RUNNER_TEMP/oreo-import-fixes.patch" 2>/dev/null; then
            echo "Import fixes are already present in this source, skipping."
          elif git apply --check "$RUNNER_TEMP/oreo-import-fixes.patch" 2>/dev/null; then
            git apply --whitespace=nowarn "$RUNNER_TEMP/oreo-import-fixes.patch"
            echo "Applied import fixes."
          elif git apply --check -C1 "$RUNNER_TEMP/oreo-import-fixes.patch" 2>/dev/null; then
            git apply --whitespace=nowarn -C1 "$RUNNER_TEMP/oreo-import-fixes.patch"
            echo "Applied import fixes (with reduced context)."
          else
            echo "::error::The import fixes do not match this version of the source. Re-run with apply_fixes turned off, or set ref to commit 090a81d."
            exit 1
          fi

      - name: Resize AppIcon to 1024x1024
        run: |
          ICON="Cascade/Assets.xcassets/AppIcon.appiconset/icon.png"
          if [[ -f "$ICON" ]]; then
            ACTUAL=$(sips -g pixelWidth "$ICON" 2>/dev/null | awk '/pixelWidth/{print $2}')
            if [[ -n "$ACTUAL" && "$ACTUAL" != "1024" ]]; then
              echo "Resizing icon from ${ACTUAL}px to 1024px"
              sips -z 1024 1024 "$ICON"
            else
              echo "Icon is already 1024x1024"
            fi
          else
            echo "AppIcon path not found at $ICON, skipping resize."
          fi

      - name: Rename app
        run: |
          python3 - <<'PY'
          import os, pathlib, re

          name = os.environ["APP_NAME"]
          changed = 0

          # Info.plist: display name and permission texts
          plist_candidates = [
              pathlib.Path("Cascade/App/Info.plist"),
              pathlib.Path("Cascade/Info.plist"),
          ]
          plist = next((p for p in plist_candidates if p.exists()), None)
          if plist is not None:
              text = plist.read_text()
              new = text.replace("Cascade", name)
              if name != "Cascade" and new == text:
                  print(f"Warning: 'Cascade' not found in {plist}, relying on INFOPLIST_KEY_CFBundleDisplayName")
              elif new != text:
                  plist.write_text(new)
          else:
              print("Warning: Info.plist not found in standard paths, relying on INFOPLIST_KEY_CFBundleDisplayName")

          # Swift sources: only text inside string literals that mention the app name
          if name != "Cascade":
              literal = re.compile(r'"(?:[^"\\\n]|\\.)*"')
              for path in pathlib.Path("Cascade").rglob("*.swift"):
                  src = path.read_text()
                  out = literal.sub(
                      lambda m: m.group(0).replace("Cascade", name) if "Cascade" in m.group(0) else m.group(0),
                      src,
                  )
                  if out != src:
                      path.write_text(out)
                      changed += 1
          print(f"Configured app name {name!r} (updated {changed} Swift file(s))")
          PY

      - name: Select Xcode
        run: |
          if [[ -n "$XCODE_VERSION" ]]; then
            DIR="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
            if [[ ! -d "$DIR" ]]; then
              echo "::error::Xcode $XCODE_VERSION is not on this runner. Installed versions:"
              ls /Applications | grep -i xcode || true
              exit 1
            fi
            sudo xcode-select -s "$DIR"
          else
            LATEST=$(ls /Applications | grep -E '^Xcode_[0-9]' | sort -V | tail -1 || true)
            if [[ -n "$LATEST" && -d "/Applications/$LATEST/Contents/Developer" ]]; then
              sudo xcode-select -s "/Applications/$LATEST/Contents/Developer"
              echo "Auto-selected latest Xcode: $LATEST"
            fi
          fi
          xcodebuild -version
          swift --version

      - name: Build (archive)
        run: |
          set -o pipefail
          mkdir -p build
          args=(
            archive
            -project Cascade.xcodeproj
            -scheme Cascade
            -configuration "$BUILD_CONFIG"
            -destination "generic/platform=iOS"
            -archivePath build/App.xcarchive
            -derivedDataPath build/DerivedData
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=
            DEVELOPMENT_TEAM=
            "PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID"
            "INFOPLIST_KEY_CFBundleDisplayName=$APP_NAME"
          )
          if [[ -n "$DEPLOYMENT_TARGET" ]]; then
            args+=("IPHONEOS_DEPLOYMENT_TARGET=$DEPLOYMENT_TARGET")
          fi
          if [[ -n "$EXTRA_XCODEBUILD_ARGS" ]]; then
            read -r -a extra <<< "$EXTRA_XCODEBUILD_ARGS"
            args+=("${extra[@]}")
          fi
          echo "xcodebuild ${args[*]}"
          xcodebuild "${args[@]}" 2>&1 | tee build/xcodebuild.log

      - name: Show build errors
        if: ${{ failure() }}
        run: |
          echo "---- first errors from the build log ----"
          grep -n "error:" build/xcodebuild.log | head -40 || true

      - name: Package IPA (TrollStore ldid / Unsigned)
        run: |
          set -e
          APP="$(find build/App.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)"
          [[ -n "$APP" ]] || { echo "::error::No .app found in the archive"; exit 1; }

          # Prepare entitlements (merge project entitlements + TrollStore JIT/memory keys)
          TMP_ENT="$RUNNER_TEMP/trollstore.entitlements"
          EMPTY_ENT="$RUNNER_TEMP/empty.entitlements"
          cat > "$EMPTY_ENT" <<'PLIST_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict/>
          </plist>
          PLIST_EOF

          ENT_FILE="$(find Cascade -maxdepth 3 -name '*.entitlements' | head -1 || true)"
          if [[ -n "$ENT_FILE" && -f "$ENT_FILE" ]]; then
            cp "$ENT_FILE" "$TMP_ENT"
          else
            cp "$EMPTY_ENT" "$TMP_ENT"
          fi

          for key in \
            "get-task-allow" \
            "com.apple.developer.kernel.increased-memory-limit" \
            "com.apple.developer.kernel.extended-virtual-addressing" \
            "com.apple.security.cs.allow-jit" \
            "com.apple.security.cs.allow-unsigned-executable-memory"; do
            /usr/libexec/PlistBuddy -c "Delete :$key" "$TMP_ENT" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :$key bool true" "$TMP_ENT"
          done

          if [[ "$CODESIGN_MODE" == "ldid" ]]; then
            command -v ldid >/dev/null 2>&1 || brew install ldid
            codesign --remove-signature "$APP" 2>/dev/null || true

            # Fake-sign nested frameworks, dylibs, and app extensions first
            if [[ -d "$APP/Frameworks" ]]; then
              find "$APP/Frameworks" -type f -name "*.dylib" -exec ldid -S"$EMPTY_ENT" {} +
              find "$APP/Frameworks" -maxdepth 1 -name "*.framework" -exec ldid -S"$EMPTY_ENT" {} +
            fi
            if [[ -d "$APP/PlugIns" ]]; then
              find "$APP/PlugIns" -maxdepth 1 -name "*.appex" -exec ldid -S"$TMP_ENT" {} +
            fi

            # Fake-sign main app bundle with TrollStore JIT & high-memory entitlements
            ldid -S"$TMP_ENT" "$APP"
            echo "---- Embedded TrollStore Entitlements ----"
            ldid -e "$APP" || true
          elif [[ "$CODESIGN_MODE" == "adhoc" ]]; then
            if [[ -d "$APP/Frameworks" ]]; then
              find "$APP/Frameworks" -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) -exec codesign -f -s - {} +
            fi
            if [[ -d "$APP/PlugIns" ]]; then
              find "$APP/PlugIns" -maxdepth 1 -name "*.appex" -exec codesign -f -s - {} +
            fi
            codesign -f -s - --entitlements "$TMP_ENT" "$APP"
          fi

          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -q -r "${IPA_NAME}.ipa" Payload && rm -rf Payload)
          ls -lh "out/${IPA_NAME}.ipa"

      - name: Write build summary
        run: |
          {
            echo "## OREO iOS build"
            echo ""
            echo "- Source: \`${SOURCE_REPO:-$GITHUB_REPOSITORY}\` @ \`$(git rev-parse --short HEAD)\`"
            echo "- App name: \`$APP_NAME\`  |  Bundle id: \`$BUNDLE_ID\`  |  Configuration: \`$BUILD_CONFIG\`"
            echo "- Import fixes: \`${{ inputs.apply_fixes }}\`  |  Code signing: \`$CODESIGN_MODE\`"
            echo ""
            echo "| File | Size | SHA-256 |"
            echo "|---|---|---|"
            for f in out/*; do
              [[ -f "$f" ]] || continue
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) | \`$(shasum -a 256 "$f" | cut -d' ' -f1)\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OREO_iOS_${{ github.run_number }}
          path: out/*
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error

      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: ${{ inputs.make_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" out/* --repo "$GITHUB_REPOSITORY" \
              --title "$APP_NAME $RELEASE_TAG" \
              --notes "iOS build fake-signed with ldid for TrollStore (iOS 16.5)." \
              --prerelease
          fi
