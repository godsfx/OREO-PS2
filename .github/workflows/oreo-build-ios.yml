          +        guard mapOff >= 124, mapOff + 16 <= fileSize else {
          +            throw CHDError.mapDecodeFailed("map header out of bounds")
          +        }
          +        try handle.seek(toOffset: UInt64(mapOff))
          +        guard let mapHead = try handle.read(upToCount: 16), mapHead.count == 16 else {
          +            throw CHDError.mapDecodeFailed("map header out of bounds")
          +        }
          +        let b = mapHead.startIndex
          +        let b0 = Int(mapHead[b]),     b1 = Int(mapHead[b + 1])
          +        let b2 = Int(mapHead[b + 2]), b3 = Int(mapHead[b + 3])
          +        let compBytes = (b0 << 24) | (b1 << 16) | (b2 << 8) | b3
          +        let prefixLength = mapOff + 16 + compBytes
          +        guard compBytes >= 0, prefixLength <= fileSize else {
          +            throw CHDError.mapDecodeFailed("compressed map out of bounds")
          +        }
