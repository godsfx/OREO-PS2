          +            // 3. Create a library entry for every game image.
          +            for dest in copied {
          +                let ext  = dest.pathExtension.lowercased()
          +                let name = dest.lastPathComponent
           
          -    private static func copyISO(from url: URL, to gamesDir: URL) throws -> GameEntry {
          -        let dest = gamesDir.appendingPathComponent(url.lastPathComponent)
          -        if !FileManager.default.fileExists(atPath: dest.path) {
          -            try FileManager.default.copyItem(at: url, to: dest)
          -        }
          -        let cdvd = CDVD()
          -        try? cdvd.loadISO(url: dest)
          -        var entry = GameEntry(url: dest, cdvd: cdvd)
          -        if !cdvd.discID.isEmpty {
          -            entry.id    = cdvd.discID
          -            entry.title = titleLookup[cdvd.discID.uppercased()] ?? entry.title
          +                if ["zip", "7z", "rar", "gz", "tar"].contains(ext) {
          +                    problems.append("\(name): archives are not supported. Extract the game image first.")
          +                    try? FileManager.default.removeItem(at: dest)
          +                    continue
          +                }
          +
          +                if ext == "bin" && referencedBins.contains(name.lowercased()) {
          +                    continue   // handled through its .cue
          +                }
          +
          +                if ext == "cue" {
          +                    if let binName = GameLibraryManager.binName(inCUE: dest),
          +                       !FileManager.default.fileExists(atPath: destDir.appendingPathComponent(binName).path) {
          +                        problems.append("\(name): needs \(binName). Select the .bin together with the .cue.")
          +                        try? FileManager.default.removeItem(at: dest)
