          +        let ext  = dest.pathExtension.lowercased()
          +        let cdvd = CDVD()
          +        do {
          +            switch ext {
          +            case "cue": try cdvd.loadCUE(url: dest)
          +            case "chd": try cdvd.loadCHD(url: dest)
