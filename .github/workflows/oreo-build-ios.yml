name: OREO iOS Build

# Put this file at:  .github/workflows/oreo-build-ios.yml  in your fork of Leviidev/Cascade.
# Run it from the Actions tab -> "OREO iOS Build" -> "Run workflow".
# It builds an UNSIGNED .ipa for sideloading (Sideloadly / AltStore re-sign it with your Apple ID).
#
# What it does on top of a plain build:
#   * applies the import fixes (several files at once, BIN+CUE together, CHD, library survives re-install)
#   * renames the app (default "OREO") and changes the bundle id
#
# You can also run it in an EMPTY repo of your own: set "source_repo" to Leviidev/Cascade.

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Source: repo to build as owner/name (empty = this repo, i.e. your fork)"
        type: string
        default: ""
      ref:
        description: "Source: branch, tag or commit (empty = default branch)"
        type: string
        default: ""
      apply_fixes:
        description: "Source: apply the OREO import fixes before building"
        type: boolean
        default: true
      app_name:
        description: "App: name shown on the home screen and inside the app"
        type: string
        default: "OREO"
      bundle_id:
        description: "App: bundle identifier (change it to install next to another build)"
        type: string
        default: "com.oreo.ps2"
      build_config:
        description: "Build: Release is faster at runtime; Debug is easier to debug"
        type: choice
        options: [Release, Debug]
        default: Release
      deployment_target:
        description: "Build: minimum iOS version (empty = project default, 16.0)"
        type: string
        default: ""
      runner:
        description: "Build: macOS runner image"
        type: choice
        options: [macos-15, macos-latest, macos-14]
        default: macos-15
      xcode_version:
        description: "Build: Xcode version such as 16.2 (empty = runner default)"
        type: string
        default: ""
      extra_xcodebuild_args:
        description: "Build: extra xcodebuild arguments, space separated"
        type: string
        default: ""
      codesign_mode:
        description: "Package: ad-hoc sign the app, or leave it unsigned"
        type: choice
        options: [adhoc, none]
        default: adhoc
      ipa_name:
        description: "Package: output file name without .ipa"
        type: string
        default: "OREO"
      retention_days:
        description: "Output: days to keep the downloadable artifact (1-90)"
        type: string
        default: "30"
      make_release:
        description: "Output: also publish the IPA as a GitHub Release on this repo"
        type: boolean
        default: false
      release_tag:
        description: "Output: tag for the release (required if publishing), e.g. v1.0-oreo"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: oreo-ios-${{ github.ref }}-${{ inputs.source_repo }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  build_ios:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    env:
      APP_NAME: ${{ inputs.app_name }}
      BUNDLE_ID: ${{ inputs.bundle_id }}
      BUILD_CONFIG: ${{ inputs.build_config }}
      DEPLOYMENT_TARGET: ${{ inputs.deployment_target }}
      XCODE_VERSION: ${{ inputs.xcode_version }}
      EXTRA_XCODEBUILD_ARGS: ${{ inputs.extra_xcodebuild_args }}
      CODESIGN_MODE: ${{ inputs.codesign_mode }}
      IPA_NAME: ${{ inputs.ipa_name }}
      RETENTION_DAYS: ${{ inputs.retention_days }}
      MAKE_RELEASE: ${{ inputs.make_release }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_REPO: ${{ inputs.source_repo }}
    steps:
      - name: Validate inputs
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ -z "$SOURCE_REPO" || "$SOURCE_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || fail "source_repo must look like owner/name"
          [[ "$APP_NAME" =~ ^[A-Za-z0-9\ ._!-]{1,30}$ ]] || fail "app_name: 1-30 characters, letters/digits/space and . _ ! - only"
          [[ "$BUNDLE_ID" =~ ^[A-Za-z0-9.-]+$ ]] || fail "bundle_id may only contain letters, digits, dots and dashes"
          [[ "$DEPLOYMENT_TARGET" =~ ^([0-9]+(\.[0-9]+){0,2})?$ ]] || fail "deployment_target must look like 16.0"
          [[ "$XCODE_VERSION" =~ ^([0-9]+(\.[0-9]+){0,2})?$ ]] || fail "xcode_version must look like 16.2"
          [[ "$IPA_NAME" =~ ^[A-Za-z0-9._-]+$ ]] || fail "ipa_name may only contain letters, digits, dot, dash, underscore"
          [[ "$RETENTION_DAYS" =~ ^[0-9]+$ ]] && (( RETENTION_DAYS >= 1 && RETENTION_DAYS <= 90 )) || fail "retention_days must be 1-90"
          if [[ "$MAKE_RELEASE" == "true" ]]; then
            [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || fail "release_tag is required (letters, digits, dot, dash, underscore) when make_release is on"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.ref }}

      - name: Apply OREO import fixes
        if: ${{ inputs.apply_fixes }}
