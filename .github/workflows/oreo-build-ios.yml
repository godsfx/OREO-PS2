          diff --git a/Cascade/UI/LibraryView.swift b/Cascade/UI/LibraryView.swift
          index 1f8c16f..af649ae 100644
          --- a/Cascade/UI/LibraryView.swift
          +++ b/Cascade/UI/LibraryView.swift
