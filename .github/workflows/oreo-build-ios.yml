                   if sectorSize == 2048 {
          -            // CHD path — delegate to the CHDReader when the raw Data is empty
          -            if data.isEmpty, let chd = chdReader {
          -                let offset = UInt64(lba) * 2048
          -                return (try? chd.readBytes(at: offset, length: Int(size))) ?? Data()
          -            }
