          +            let folder = gamesDir
          +            games = decoded.compactMap { entry -> GameEntry? in
          +                if FileManager.default.fileExists(atPath: entry.url.path) { return entry }
          +                // The app's container path can change after a re-install; look in the games folder.
          +                let moved = folder.appendingPathComponent(entry.url.lastPathComponent)
          +                guard FileManager.default.fileExists(atPath: moved.path) else { return nil }
          +                var fixed = entry
          +                fixed.url = moved
          +                return fixed
          +            }
                   }
                   if let data = try? Data(contentsOf: collectionsURL),
                      let decoded = try? JSONDecoder().decode([GameCollection].self, from: data) {
