          +
          +    private func readFileBytes(at offset: Int, length: Int) throws -> Data {
          +        guard offset >= 0, length > 0, offset + length <= fileSize else { throw CHDError.outOfBounds }
          +        do {
          +            try file.seek(toOffset: UInt64(offset))
          +            guard let bytes = try file.read(upToCount: length), bytes.count == length else {
          +                throw CHDError.outOfBounds
          +            }
          +            return bytes
          +        } catch let error as CHDError {
          +            throw error
