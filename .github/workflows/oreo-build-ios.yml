      - name: Rename app
        run: |
          python3 - <<'PY'
          import os, pathlib, re

          name = os.environ["APP_NAME"]
          changed = 0

          # Info.plist: display name and the permission texts
          plist = pathlib.Path("Cascade/App/Info.plist")
          text = plist.read_text()
          new = text.replace("Cascade", name)
          if new == text:
              raise SystemExit("Did not find the app name in Info.plist (project layout changed?)")
          plist.write_text(new)

          # Swift sources: only text inside string literals that mention the app name
          literal = re.compile(r'"(?:[^"\\\n]|\\.)*"')
          for path in pathlib.Path("Cascade").rglob("*.swift"):
              src = path.read_text()
              out = literal.sub(lambda m: m.group(0).replace("Cascade", name) if "Cascade" in m.group(0) else m.group(0), src)
              if out != src:
                  path.write_text(out)
                  changed += 1
          print(f"Renamed to {name!r} in Info.plist and {changed} Swift file(s)")
          PY

      - name: Select Xcode
        if: ${{ inputs.xcode_version != '' }}
        run: |
          DIR="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          if [[ ! -d "$DIR" ]]; then
            echo "::error::Xcode $XCODE_VERSION is not on this runner. Installed versions:"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          sudo xcode-select -s "$DIR"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build (archive)
        run: |
          set -o pipefail
          mkdir -p build
          args=(
            archive
            -project Cascade.xcodeproj
            -scheme Cascade
            -configuration "$BUILD_CONFIG"
            -destination "generic/platform=iOS"
            -archivePath build/App.xcarchive
            -derivedDataPath build/DerivedData
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=
            DEVELOPMENT_TEAM=
            "PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID"
          )
          if [[ -n "$DEPLOYMENT_TARGET" ]]; then
            args+=("IPHONEOS_DEPLOYMENT_TARGET=$DEPLOYMENT_TARGET")
          fi
          if [[ -n "$EXTRA_XCODEBUILD_ARGS" ]]; then
            read -r -a extra <<< "$EXTRA_XCODEBUILD_ARGS"
            args+=("${extra[@]}")
          fi
          echo "xcodebuild ${args[*]}"
          xcodebuild "${args[@]}" 2>&1 | tee build/xcodebuild.log

      - name: Show build errors
        if: ${{ failure() }}
        run: |
          echo "---- first errors from the build log ----"
          grep -n "error:" build/xcodebuild.log | head -40 || true

      - name: Package IPA
        run: |
          APP="$(find build/App.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)"
          [[ -n "$APP" ]] || { echo "::error::No .app found in the archive"; exit 1; }
          if [[ "$CODESIGN_MODE" == "adhoc" ]]; then
            codesign -f -s - "$APP"
          fi
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -q -r "${IPA_NAME}.ipa" Payload && rm -rf Payload)
          ls -lh "out/${IPA_NAME}.ipa"

      - name: Write build summary
        run: |
          {
            echo "## OREO iOS build"
            echo ""
            echo "- Source: \`${SOURCE_REPO:-$GITHUB_REPOSITORY}\` @ \`$(git rev-parse --short HEAD)\`"
            echo "- App name: \`$APP_NAME\`  |  Bundle id: \`$BUNDLE_ID\`  |  Configuration: \`$BUILD_CONFIG\`"
            echo "- Import fixes: \`${{ inputs.apply_fixes }}\`  |  Code signing: \`$CODESIGN_MODE\`"
            echo ""
            echo "| File | Size | SHA-256 |"
            echo "|---|---|---|"
            for f in out/*; do
              [[ -f "$f" ]] || continue
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) | \`$(shasum -a 256 "$f" | cut -d' ' -f1)\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OREO_iOS_${{ github.run_number }}
          path: out/*
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error

      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: ${{ inputs.make_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" out/* --repo "$GITHUB_REPOSITORY" \
              --title "$APP_NAME $RELEASE_TAG" \
              --notes "Unsigned iOS build. Sideload with Sideloadly or AltStore." \
              --prerelease
          fi
          
