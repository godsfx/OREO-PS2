          diff --git a/Cascade/Core/PS2/CHDReader.swift b/Cascade/Core/PS2/CHDReader.swift
          index 9d6d4c6..4bce081 100644
          --- a/Cascade/Core/PS2/CHDReader.swift
          +++ b/Cascade/Core/PS2/CHDReader.swift
          @@ -54,7 +54,10 @@ public final class CHDReader {
           
