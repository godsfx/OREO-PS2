          -                guard sectorStart + copyLen <= data.count else { break }
          -                result.append(contentsOf: data[sectorStart..<sectorStart + copyLen])
          +                guard let chunk = readDisc(at: sectorStart, length: copyLen),
          +                      chunk.count == copyLen else { break }
          +                result.append(chunk)
                       }
